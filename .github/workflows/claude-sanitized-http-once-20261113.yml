name: Claude sanitized HTTP one-time probe (2026-11-13)
on:
  workflow_dispatch:
    inputs:
      approval:
        description: 'Owner approval for a single bounded Claude connectivity diagnostic'
        type: string
        required: true
jobs:
  probe:
    if: github.actor == 'kinoko34077' && github.event.inputs.approval == 'approved-once-sanitized-2026-11-13'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: claude-sanitized-once-20261113
      cancel-in-progress: false
    steps:
      - name: Checkout diagnostic-only source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python for existing validated diagnostic
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - name: Prepare no-tool one-turn probe
        shell: bash
        run: |
          printf '%s\n' 'Connection check only. Reply with the exact text SONNET55_CONNECTION_OK. Do not use tools or read repository content.' > "$RUNNER_TEMP/claude-sanitized-probe-prompt.txt"
          printf '{"mcpServers":{}}\n' > "$RUNNER_TEMP/claude-sanitized-empty-mcp.json"
      - name: One human-approved Sonnet 5.5 medium exchange
        id: claude
        continue-on-error: true
        uses: anthropics/claude-code-base-action@dd171826d0197ac293cd459b506790de5119f573 # pinned, same production version
        with:
          prompt_file: ${{ runner.temp }}/claude-sanitized-probe-prompt.txt
          anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          show_full_output: false
          claude_args: >-
            --model claude-sonnet-5-5
            --effort medium
            --max-turns 1
            --max-budget-usd 0.25
            --safe-mode
            --strict-mcp-config
            --mcp-config "${{ runner.temp }}/claude-sanitized-empty-mcp.json"
            --disallowedTools "*"
            --permission-mode plan
      - name: Classify using existing privacy-preserving SDK HTTP diagnostic
        if: always()
        env:
          RUNNER_TEMP: ${{ runner.temp }}
          PYTHONPATH: src
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
        shell: bash
        run: |
          if [ "$CLAUDE_OUTCOME" = "success" ]; then
            echo 'claude_probe_result=SUCCESS' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo 'claude_probe_result=FAILURE' | tee -a "$GITHUB_STEP_SUMMARY"
          # Prints only a finite category and an integer HTTP code or UNAVAILABLE.
          python -m execution_coordinator.provider_failure_diagnostic | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1
